<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fatbox</title>
<style>
:root{color-scheme:dark;--bg:#121214;--card:#27292f;--pill:#222428;--blue:#335fff;--tx:#fff;--mu:#a9acb3;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;max-width:480px;margin:0 auto;min-height:100vh}
button{font:inherit;color:inherit;border:0;cursor:pointer}
.splash{position:fixed;inset:0;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;z-index:9}
.bar{width:180px;height:6px;background:#222;border-radius:3px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:#fff;animation:ld 2.2s linear forwards}
@keyframes ld{to{width:100%}}
.logo{font-size:46px;font-weight:900;letter-spacing:2px;animation:fi .8s both}
@keyframes fi{from{opacity:0;transform:scale(.9)}}
.btn{background:var(--blue);padding:14px 28px;border-radius:10px;font-weight:600;font-size:17px}
.btn.g{background:var(--card)}.btn.o{background:none;border:1.5px solid #ddd;width:100%}
input{width:260px;padding:14px;border-radius:10px;border:1px solid #333;background:#111;color:#fff;font-size:16px}
.sb{position:absolute;left:24px;right:24px;bottom:calc(32px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}.sb .btn{width:100%;text-align:center}.lk{color:var(--mu);font-size:15px;cursor:pointer;padding:6px}
.err{color:#ff6b6b;min-height:20px;font-size:14px}
.top{display:flex;align-items:center;justify-content:space-between;padding:14px 18px}
.top b{font-size:26px;font-weight:900;letter-spacing:1px}.ic{display:flex;gap:22px;font-size:22px}
.tabs{display:flex;border-bottom:2px solid #2a2c31;margin:0 18px}.tabs div{flex:1;text-align:center;padding:12px;color:var(--mu)}.tabs .on{color:#fff;border-bottom:2px solid #fff;margin-bottom:-2px}
.me{display:flex;align-items:center;gap:14px;padding:18px;font-size:24px;font-weight:700}
.circ{width:52px;height:52px;border-radius:50%;background:#2b2d33;overflow:hidden;position:relative;flex:none}
.fr{display:flex;gap:14px;padding:0 18px;overflow-x:auto}.fr div{text-align:center;font-size:13px;width:84px;flex:none}.fr .circ{width:84px;height:84px;margin-bottom:6px}
h2{margin:22px 18px 12px;font-size:24px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:0 18px}
.g1 .th{height:84px;border-radius:12px;margin-bottom:6px}.g1 b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.g1 small{color:var(--mu)}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:var(--bg);display:flex;justify-content:space-around;padding:10px 0 calc(10px + env(safe-area-inset-bottom,0px));border-top:1px solid #222}
.nav div{text-align:center;font-size:13px;cursor:pointer}.nav span{display:block;font-size:22px}
.hero{height:340px;background:linear-gradient(#3a3d44,#5a6272 55%,#121214);display:flex;align-items:flex-end;justify-content:center;position:relative}
.x{position:absolute;top:14px;left:16px;width:44px;height:44px;border-radius:50%;background:#000a;font-size:22px}
.head{display:flex;align-items:center;gap:18px;padding:0 18px;margin-top:-20px}.head .circ{width:96px;height:96px}.head h1{margin:0;font-size:28px}.head p{margin:2px 0 0;color:var(--mu)}
.stats{display:flex;gap:10px;padding:18px;flex-wrap:wrap}.stats span{background:var(--pill);padding:12px 16px;border-radius:22px}
.acts{display:flex;gap:10px;padding:0 18px}.acts .btn{flex:1;padding:14px 8px;text-align:center;font-size:16px}.acts .sq{flex:none;width:52px;padding:14px 0}
.play{margin:0 18px 16px;border:1px solid #333;border-radius:12px;padding:14px;display:flex;gap:12px;align-items:center}.play .th{width:52px;height:52px;border-radius:6px}
.wear{display:flex;gap:12px;padding:0 18px;overflow-x:auto}.wear div{width:116px;flex:none}.wear .it{height:116px;background:var(--card);border-radius:12px;display:flex;align-items:center;justify-content:center;margin-bottom:6px}
.ul{padding:0 18px}.ul div{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid #222}
.dot{width:14px;height:14px;border-radius:50%;background:#2ecc71;display:inline-block}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#333;padding:10px 16px;border-radius:10px;z-index:20}
.rv{display:flex;gap:14px;padding:0 18px;overflow-x:auto}.rv>div{width:141px;flex:none;cursor:pointer}.rv .th{width:141px;height:141px;border-radius:12px;margin-bottom:10px}.rv b{display:block;font-size:17px;line-height:1.25;height:44px;overflow:hidden}.rv small{color:var(--mu);font-size:15px;white-space:nowrap;display:block;margin-top:6px}
.chips{display:flex;gap:14px;padding:0 18px;overflow-x:auto}.chips span{background:#222428;padding:14px 22px;border-radius:26px;font-size:20px;flex:none;cursor:pointer}
.dd{position:absolute;top:64px;left:18px;width:236px;background:#25272e;border:1px solid #2f3138;border-radius:14px;padding:6px 0;z-index:5}.dd div{padding:14px 20px;font-size:19px;cursor:pointer}
.stg{height:440px;position:relative;background:linear-gradient(#2b2d33,#3a3d44 60%,#26282d);overflow:hidden}
.tp{display:flex;align-items:center;justify-content:space-between;padding:18px}
.pl{display:flex;background:#2a2c32;border-radius:26px;padding:6px;gap:4px}.pl span{padding:10px 18px;border-radius:22px;font-size:17px;color:#ddd}.pl .on{background:#44474f;color:#fff}
.side{position:absolute;left:18px;top:90px;background:#101114cc;border-radius:30px;padding:10px;display:flex;flex-direction:column;align-items:center;gap:14px;font-size:26px;z-index:2}
.cur{position:absolute;right:18px;top:90px;background:#101114cc;border-radius:30px;padding:16px 22px;font-size:22px;display:flex;gap:10px;align-items:center;z-index:2}
.av{position:absolute;left:50%;transform:translateX(-50%);bottom:0;width:210px;height:340px}
.ur{position:absolute;left:18px;bottom:18px;background:#101114cc;border-radius:30px;padding:14px 22px;display:flex;gap:30px;font-size:26px;z-index:2}
.sh{background:var(--bg);border-radius:22px 22px 0 0;margin-top:-18px;position:relative;padding-top:12px}
.tb{display:flex;gap:26px;padding:12px 18px 0;overflow-x:auto;font-size:21px;font-weight:600;color:var(--mu);align-items:center;border-bottom:1px solid #222}.tb span{padding-bottom:12px;flex:none}.tb .on{color:#fff;border-bottom:3px solid #fff}
.ig{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:0 14px 120px}.ig>div{font-size:15px;min-width:0}.ig b{display:block;font-size:17px;margin:8px 0 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ig small{color:var(--mu);display:block;margin-bottom:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.it2{aspect-ratio:1;background:var(--card);border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:46px}.vf{color:#4a7dff}
.ep{min-height:100vh}.eh{display:flex;align-items:center;gap:24px;padding:26px 22px;font-size:26px}.eh b{font-size:28px}.eh span{cursor:pointer;font-size:34px}
.ec{display:flex;justify-content:center;padding:20px 0 34px}
.rows{margin:0 18px 22px;border:1px solid #2a2c31;border-radius:22px}.rows div{display:flex;align-items:center;gap:12px;padding:24px 22px;border-bottom:1px solid #2a2c31;cursor:pointer;font-size:19px}.rows div:last-child{border:0}.rows b{flex:1}.rows span{color:#cfd2d8}.rows i{font-style:normal;font-size:26px}
.fld{margin:14px 18px 0;border:1px solid #2f3138;border-radius:14px;display:flex;align-items:center;padding-right:16px}.fld input{flex:1;width:auto;min-width:0;border:0;background:none;padding:18px;font-size:20px}.fld span{font-size:26px;cursor:pointer}
.ov{position:fixed;inset:0;background:#000b;display:flex;align-items:center;justify-content:center;z-index:30;padding:20px}.bx{background:#25272e;border-radius:18px;padding:24px;width:100%;max-width:440px;text-align:center}.bx h3{margin:6px 0 16px;font-size:26px}.bx hr{border:0;border-top:1px solid #3a3d44;margin:0 0 22px}.bx p{font-size:20px;line-height:1.35;margin:0 0 26px}.bb{display:flex;gap:16px}.bb .btn{flex:1;padding:14px 8px;font-size:17px}.btn.w{background:#f5f5f5;color:#111}
</style></head><body><div id="app"></div>
<script>
const $=s=>document.querySelector(s);
const bacon=(mode,o)=>bareify(`<svg viewBox="${mode=='head'?'30 0 90 80':'0 0 150 230'}" width="100%" height="100%" preserveAspectRatio="xMidYMax meet">
<rect x="35" y="95" width="80" height="62" fill="#1b1b1b"/><rect x="58" y="95" width="34" height="60" fill="#1f87d6"/><path d="M68 118q8-8 18 0v8H68z" fill="#0b2b46"/>
<rect x="12" y="95" width="23" height="28" fill="#111"/><rect x="115" y="95" width="23" height="28" fill="#111"/><rect x="12" y="123" width="23" height="38" rx="4" fill="#eee"/><rect x="115" y="123" width="23" height="38" rx="4" fill="#eee"/>
<rect x="40" y="157" width="34" height="56" fill="#1e2b25"/><rect x="76" y="157" width="34" height="56" fill="#1e2b25"/><rect x="38" y="212" width="38" height="14" rx="4" fill="#fff"/><rect x="74" y="212" width="38" height="14" rx="4" fill="#fff"/>
<rect x="50" y="22" width="50" height="68" rx="10" fill="#eceef0"/><circle cx="66" cy="52" r="2.5" fill="#000"/><circle cx="86" cy="52" r="2.5" fill="#000"/><path d="M66 68q10 7 20 0" stroke="#000" stroke-width="2.5" fill="none" stroke-linecap="round"/>
<path d="M44 40q-4-30 24-30 30-6 38 22 4 10 0 24l-6-18q-20 4-36-10l-2 22z" fill="#d9731a"/></svg>`,mode,o);
const th=(a,b)=>`background:linear-gradient(135deg,${a},${b})`;
const GAMES=[["[Вложения] Реализм тря…","79%",th("#8fb2d6","#d6dde6")],["HEISTBLOX","83%",th("#a11","#222")],["[Обновление эпохи кор…","71%",th("#c9a35a","#4a8a5a")],["[Вулкан] Песочница с …","Ad",th("#5a8ac6","#6c3")]];
let me=null,db=null,uid=null,mem={};
try{me=JSON.parse(localStorage.getItem("fb_me")||localStorage.getItem("fb_me_bak")||"null");if(me&&!me.name)me=null}catch(e){}
const key=n=>n.trim().toLowerCase();
const isF=()=>!!me&&key(me.name)=="fatbox";
const plusSet=new Set();
const plusSync=()=>{if(me)me.plus?plusSet.add(key(me.name)):plusSet.delete(key(me.name))};
plusSync();
const PLUSB=' <svg viewBox="0 0 24 24" width="22" height="22" style="vertical-align:-3px"><path d="M12 2l8.5 5v10L12 22l-8.5-5V7z" fill="#8b4dff"/><path d="M12 7.5v9M7.5 12h9" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/></svg>';
const pubPlus=()=>{try{if(me&&me.plus)ready.then(()=>nameUpd(key(me.name),{plus:true}))}catch(e){}};
if(me)me.fr=me.fr||0;
const vb0=n=>key(n)=="fatbox"?' <svg viewBox="0 0 24 24" width="22" height="22" style="vertical-align:-3px"><path d="M12 1l3 2.2 3.7-.2 1.2 3.5 3 2.2-1.2 3.5 1.2 3.5-3 2.2-1.2 3.5-3.7-.2L12 23l-3-2.2-3.7.2-1.2-3.5-3-2.2 1.2-3.5L1.1 8.8l3-2.2 1.2-3.5L9 3.2z" fill="#335fff"/><path d="M7.5 12.3l3 3 6-6.3" stroke="#fff" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>':"";
const vb=n=>vb0(n)+(plusSet.has(key(n))?PLUSB:"");
function toast(t){const d=document.createElement("div");d.className="toast";d.textContent=t;document.body.append(d);setTimeout(()=>d.remove(),1800)}
const ready=(async()=>{try{db=await claude.use("db");const u=await claude.use("user");if(u)uid=await u.id()}catch(e){}})();

async function nameUpd(k,o){
 if(!db||!k)return;const path="names/"+encodeURIComponent(k);
 for(let i=0;i<3;i++){try{await db.doc(path).update(o);return}catch(e){await new Promise(r=>setTimeout(r,700*(i+1)))}}
 try{const r=db.doc(path),sn=await r.get();
  if(sn.exists)await r.set({...sn.data(),...o});
  else if(me&&key(me.name)==k)await r.set({owner:uid||"guest",name:me.name,playing:"",pw:me.h,...o})}catch(e){}}
const ls={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}},del:k=>{try{localStorage.removeItem(k)}catch(e){}}};
const accs=()=>{try{return JSON.parse(ls.get("fb_accounts")||"{}")}catch(e){return {}}};
async function hash(n,p){try{const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode("fatbox:"+key(n)+":"+p));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}catch(e){return "p:"+key(n)+":"+p}}
function saveSession(n,h){setTimeout(()=>{try{if(db)db.doc("names/"+encodeURIComponent(key(n))).get().then(x=>{if(x.exists&&x.data().plus&&me&&!me.plus){me.plus=true;persist()}}).catch(()=>{})}catch(e){}},0);const o=accs()[key(n)]||{};me={name:n,h,dn:o.dn||"",fr:0,plus:!!o.plus};ls.set("fb_me",JSON.stringify(me));ls.set("fb_me_bak",JSON.stringify(me));const a=accs();a[key(n)]={name:n,h,dn:me.dn,fr:me.fr,plus:!!me.plus};ls.set("fb_accounts",JSON.stringify(a));try{if(db&&uid)db.collection("data/users/"+uid).doc("session").set(me).catch(()=>{})}catch(e){}}
function splash(){
 $("#app").innerHTML=`<div class="splash"><div class="bar" id="b"><i></i></div></div>`;
 setTimeout(()=>{if(me)return;$("#app").innerHTML=`<div class="splash"><div class="logo">FATBOX</div><div class="sb" style="animation:fi .8s .3s both"><button class="btn" id="c">Создать аккаунт</button><button class="btn g" id="l">Войти в аккаунт</button></div></div>`;$("#c").onclick=signup;$("#l").onclick=login},2400)}
function menu(){$("#app").innerHTML=`<div class="splash"><div class="logo">FATBOX</div><div class="sb"><button class="btn" id="c">Создать аккаунт</button><button class="btn g" id="l">Войти в аккаунт</button></div></div>`;$("#c").onclick=signup;$("#l").onclick=login}
function form(title,btn,last){
 $("#app").innerHTML=`<div class="splash"><div class="logo" style="font-size:32px">FATBOX</div><div style="color:var(--mu)">${title}</div><input id="n" placeholder="Ник (English only)" maxlength="20" autocomplete="username" value="${last||""}"><input id="p" type="password" placeholder="Пароль" maxlength="40" autocomplete="current-password"><div class="err" id="e"></div><button class="btn" id="go">${btn}</button><span class="lk" id="bk">‹ Назад</span></div>`;
 $("#bk").onclick=menu}
function signup(){
 form("Создать аккаунт","Создать");
 $("#go").onclick=async()=>{
  const n=$("#n").value.trim(),p=$("#p").value;
  if(n.length<3)return $("#e").textContent="Ник минимум 3 символа";
  if(/[А-Яа-яЁё]/.test(n))return rusBan();
  if(!/^[A-Za-z0-9_]+$/.test(n))return $("#e").textContent="Только английские буквы, цифры и _";
  if(p.length<4)return $("#e").textContent="Пароль минимум 4 символа";
  $("#go").disabled=true;
  const h=await hash(n,p),ok=await claim(n,h);
  $("#go").disabled=false;
  if(!ok)return $("#e").textContent="Этот ник уже занят";
  saveSession(n,h);home()}}
function login(){
 form("Войти в аккаунт","Войти",ls.get("fb_last")||"");
 $("#go").onclick=async()=>{
  const n=$("#n").value.trim(),p=$("#p").value;
  if(!n||!p)return $("#e").textContent="Введите ник и пароль";
  $("#go").disabled=true;
  const h=await hash(n,p),r=await check(n,h);
  $("#go").disabled=false;
  if(r.err)return $("#e").textContent=r.err=="nick"?"Неправильный ник":"Неправильный пароль";
  ls.set("fb_last",r);saveSession(r,h);home()}}
async function check(n,h){
 const k=key(n);
 if(db){try{const s=await db.doc("names/"+encodeURIComponent(k)).get();
  if(s.exists&&s.data().owner){const d=s.data();
   if(d.pw&&d.pw!==h)return {err:"pw"};
   if(!d.pw)try{await db.doc("names/"+encodeURIComponent(k)).update({pw:h})}catch(e){}
   return d.name||n}}catch(e){}}
 const a=accs()[k];if(!a)return {err:"nick"};return a.h===h?a.name:{err:"pw"}}
async function claim(n,h){
 const k=key(n);
 if(!db){const a=accs();if(a[k])return false;let t=[];try{t=JSON.parse(ls.get("fb_names")||"[]")}catch(e){}if(t.includes(k))return false;t.push(k);ls.set("fb_names",JSON.stringify(t));return true}
 try{const r=db.doc("names/"+encodeURIComponent(k));
  const l=await r.acquire({holder:uid||"guest",ttlMs:8000});if(!l.acquired)return false;
  const s=await r.get();if(s.exists&&s.data().owner)return false;
  await r.set({owner:uid||"guest",name:n,playing:"",pw:h});return true}catch(e){return false}}
function logout(){ls.del("fb_me");ls.del("fb_me_bak");try{if(db&&uid)db.collection("data/users/"+uid).doc("session").delete().catch(()=>{})}catch(e){}me=null;mem={};menu()}
async function setPlaying(g){
 mem.playing=g;if(db&&me)try{await db.doc("names/"+encodeURIComponent(key(me.name))).update({playing:g})}catch(e){}}
const nav=a=>`<div class="nav"><div onclick="home()"><span>⌂</span>Home</div><div onclick="toast('Скоро')"><span>▶</span>Moments</div><div onclick="toast('Скоро')"><span>💬</span>Chat</div><div onclick="profile(me.name,true)"><span><div class="circ" style="width:30px;height:30px;margin:auto">${bacon('head')}</div></span>Me</div></div>`;
function home(){
 $("#app").innerHTML=`<div class="top"><b>FATBOX</b><div class="ic"><span onclick="search()">🔍</span><span>⬡</span><span>🔔</span><span onclick="openMenu()" style="font-weight:900">⋯</span></div></div>
 <div class="tabs"><div class="on">For you</div><div>Charts</div></div>
 <div class="me" onclick="profile(me.name,true)" style="cursor:pointer"><div class="circ">${bacon('head')}</div><span>${esc(me.dn||me.name)}${vb(me.name)}</span></div>
 <div class="fr"><div onclick="addFriends()"><div class="circ" style="display:flex;align-items:center;justify-content:center;font-size:34px">＋</div>Add Friends</div></div>
 <h2>Recommended For You</h2><div class="grid" style="padding-bottom:110px">${GAMES.map((g,i)=>`<div class="g1" onclick="playGame(${i})"><div class="th" style="height:110px;${g[2]}"></div><b>${g[0]}</b><small>${g[1]=="Ad"?"Ad":"👍 "+g[1]+" Rating"}</small></div>`).join("")}</div>${nav()}`}

/* ===== Почта (Messages): письма от Fatbox ===== */
const mailKey=()=>"fb_mail_"+key(me.name);
function mailGet(){try{return JSON.parse(ls.get(mailKey())||"[]")}catch(e){return[]}}
function mailSet(a){ls.set(mailKey(),JSON.stringify(a.slice(0,40)))}
function mailUnread(){try{return me?mailGet().filter(m=>!m.read).length:0}catch(e){return 0}}
function mailAdd(title,text,id){
 if(!me)return;const a=mailGet();if(id&&a.some(m=>m.id==id))return;
 a.unshift({id:id||"m"+Date.now()+Math.random().toString(36).slice(2,5),t:Date.now(),title:title,text:text,read:false});mailSet(a)}
function mailWelcome(){
 if(!me||isF())return;
 mailAdd("Добро пожаловать в Fatbox!","Добро пожаловать в Fatbox! Создавай игры в Neural Studio, публикуй их, и каждый раз, когда другой игрок зайдёт в твою игру и выйдет, ты будешь получать 1 Fatrobux. Поздравляем с началом!","welcome")}
function mailGo(){const m=document.getElementById("sm");if(m)m.remove();mailScreen()}
function mailScreen(openId){
 if(document.getElementById("ml"))document.getElementById("ml").remove();
 const o=document.createElement("div");o.id="ml";
 o.style.cssText="position:fixed;top:0;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;z-index:70;background:var(--bg);display:flex;flex-direction:column";
 const fmt=t=>new Date(t).toLocaleDateString("ru-RU",{day:"numeric",month:"short"})+" "+new Date(t).toLocaleTimeString("ru-RU",{hour:"2-digit",minute:"2-digit"});
 const av='<div style="width:46px;height:46px;border-radius:50%;border:2px solid #fff;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:20px;flex:none">F</div>';
 const head=(t,back)=>`<div style="display:flex;align-items:center;gap:14px;padding:calc(12px + env(safe-area-inset-top,0px)) 16px 12px;border-bottom:1px solid #26282e"><span class="mx" style="font-size:${back?34:30}px;cursor:pointer;padding:0 6px;line-height:1">${back?"‹":"✕"}</span><b style="font-size:22px">${t}</b></div>`;
 const list=()=>{
  const a=mailGet();
  o.innerHTML=head("Messages",false)+'<div class="ml" style="flex:1;overflow-y:auto"></div>';

/* ----- сохранение всего профиля в общую базу (Chrome, Google и любой другой вход) ----- */
let synced=false,pTimer=null;
const _lsset=ls.set;
function pushProfile(){
 if(!db||!me||!me.name||!synced)return;
 try{const k=key(me.name),o={inv:invGet(),wear:wearGet(me.name),bare:bareGet(),bg:bgGet(me.name),fr:me.fr||0,fe:me.fe||0};
  if(me.plus)o.plus=true;if(me.dn)o.dn=me.dn;if(typeof me.about=="string")o.about=me.about;try{o.mail=mailGet().slice(0,30)}catch(e){}
  nameUpd(k,o)}catch(e){}}
ls.set=function(k,v){_lsset(k,v);if(/^fb_(inv|wear|bare|bg|mail)_|^fb_me$/.test(k)&&synced){clearTimeout(pTimer);pTimer=setTimeout(pushProfile,400)}};
async function pullProfile(){
 if(!db||!me||!me.name)return;
 try{
  const k=key(me.name),s=await db.doc("names/"+encodeURIComponent(k)).get();
  if(s.exists){
   const x=s.data()||{};
   let inv=[];try{inv=JSON.parse(ls.get("fb_inv_"+k)||"[]")}catch(e){}
   _lsset("fb_inv_"+k,JSON.stringify([...new Set([...inv,...(Array.isArray(x.inv)?x.inv:[])])]));
   const has=o=>o&&typeof o=="object"&&Object.keys(o).length>0,lw=wearGet(me.name),lb=bareGet();
   if(has(x.wear)||!has(lw))_lsset("fb_wear_"+k,JSON.stringify(x.wear||{}));
   if(has(x.bare)||!has(lb))_lsset("fb_bare_"+k,JSON.stringify(x.bare||{}));
   if(typeof x.bg=="string"&&(x.bg||!bgGet(me.name)))_lsset("fb_bg_"+k,x.bg);
   if(typeof x.fr=="number")me.fr=x.fr;if(typeof x.fe=="number")me.fe=x.fe;
   if(x.plus&&!me.plus)me.plus=true;
   if(x.dn)me.dn=x.dn;
   if(Array.isArray(x.mail)){const lm=mailGet(),by={};[...x.mail,...lm].forEach(m=>{if(m&&m.id){const o=by[m.id];by[m.id]=o?{...o,read:o.read||m.read}:m}});_lsset(mailKey(),JSON.stringify(Object.values(by).sort((a,b)=>b.t-a.t).slice(0,40)))}
   if(typeof x.about=="string"&&(x.about||!me.about))me.about=x.about;
   if(x.banned)_lsset("fb_devban","1");
   plusSync();_lsset("fb_me",JSON.stringify(me));_lsset("fb_me_bak",JSON.stringify(me));
   const a=accs();a[k]={name:me.name,h:me.h,dn:me.dn,fr:me.fr,plus:!!me.plus};_lsset("fb_accounts",JSON.stringify(a))}
  synced=true;pushProfile();updBal();syncEarn();
  if(document.querySelector(".ov,#sm"))return;
  if(document.querySelector(".tabs"))home();
  else if(document.querySelector(".hero")&&document.querySelector("#dd"))profile(me.name,true);
  else{refreshHeads();const av=document.querySelector(".av");if(av){av.innerHTML=bacon();applyWear(av,wearGet(me.name))}applyBg()}
 }catch(e){}}

const PUB={};

async function loadPub(){
 let ch=false;
 pubLocal().forEach(g=>{if(pubAdd(g))ch=true});
 try{await ready;if(db){const s=await db.collection("games").get();s.docs.forEach(d=>{if(pubAdd(d.data()))ch=true})}}catch(e){}
